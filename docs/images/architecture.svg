<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1330"/><stop offset="1" stop-color="#0f1a3d"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d9b25f"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e0566b"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a96b8"/>
    </marker>
    <style>
      .t{fill:#f3ecda;font-size:22px;font-weight:700}
      .s{fill:#b8c0d9;font-size:14px}
      .m{fill:#f3ecda;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .k{fill:#d9b25f;font-size:12px;font-weight:700;letter-spacing:1.5px}
      .lbl{fill:#d9b25f;font-size:13px;font-style:italic}
      .lblr{fill:#e0566b;font-size:13px;font-style:italic}
      .lblg{fill:#8a96b8;font-size:13px;font-style:italic}
    </style>
  </defs>
  <rect width="1200" height="760" rx="18" fill="url(#bg)"/>

  <!-- Pope -->
  <rect x="450" y="28" width="300" height="92" rx="14" fill="#f3ecda" fill-opacity="0.07" stroke="#f3ecda" stroke-opacity="0.6"/>
  <text x="470" y="56" class="k">THE POPE · YOU</text>
  <text x="470" y="84" class="t">Goal, budget, rules</text>
  <text x="470" y="106" class="s">approves big calls; pinged for wins</text>

  <!-- Dean -->
  <rect x="410" y="200" width="380" height="120" rx="14" fill="#1b2a5e" stroke="#d9b25f" stroke-width="2"/>
  <text x="432" y="228" class="k">THE DEAN · ORCHESTRATOR</text>
  <text x="432" y="258" class="t">Claude Code (or any agent)</text>
  <text x="432" y="282" class="s">sets lanes · starts and pauses Cardinals</text>
  <text x="432" y="303" class="s">verifies wins · merges · calls the Devils</text>

  <!-- Pope <-> Dean -->
  <line x1="570" y1="122" x2="570" y2="196" stroke="#d9b25f" stroke-width="2" marker-end="url(#a)"/>
  <text x="502" y="166" class="lbl" text-anchor="end">decisions</text>
  <line x1="630" y1="196" x2="630" y2="124" stroke="#d9b25f" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#a)"/>
  <text x="642" y="166" class="lbl">conclave ping</text>

  <!-- Board -->
  <rect x="40" y="200" width="300" height="230" rx="14" fill="#0b1330" stroke="#8a96b8" stroke-opacity="0.7"/>
  <text x="60" y="228" class="k">SHARED BOARD</text>
  <text x="60" y="256" class="m">.conclave/COORD.md</text>
  <text x="60" y="288" class="s">Pope's decisions</text>
  <text x="60" y="311" class="s">Claims · Results</text>
  <text x="60" y="334" class="s">Handoffs · Requests · Pings</text>
  <text x="60" y="370" class="m">CONCLAVE.md  (rules)</text>
  <text x="60" y="393" class="m">lanes/&lt;name&gt;.md</text>
  <text x="60" y="416" class="m">devils/&lt;round&gt;.md</text>
  <line x1="406" y1="262" x2="344" y2="262" stroke="#8a96b8" stroke-width="2" marker-end="url(#ag)" marker-start="url(#ag)"/>

  <!-- Devils -->
  <rect x="860" y="200" width="300" height="230" rx="14" fill="#2a0f1f" stroke="#e0566b" stroke-width="2"/>
  <text x="880" y="228" class="k" style="fill:#e0566b">THE DEVILS · ADVOCATES</text>
  <text x="880" y="258" class="t">Other models</text>
  <text x="880" y="284" class="s">called when the team is stuck;</text>
  <text x="880" y="305" class="s">get the real numbers, argue back</text>
  <text x="880" y="342" class="m">api  → DeepSeek R1</text>
  <text x="880" y="366" class="m">api  → Ollama llama3.3</text>
  <text x="880" y="390" class="m">codex (read-only)</text>
  <text x="880" y="414" class="m">gemini (read-only)</text>
  <line x1="794" y1="250" x2="856" y2="250" stroke="#e0566b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="856" y1="290" x2="794" y2="290" stroke="#e0566b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <text x="825" y="242" class="lblr" text-anchor="middle">brief</text>
  <text x="825" y="310" class="lblr" text-anchor="middle">ideas</text>

  <!-- Dean -> Cardinals -->
  <path d="M600 322 L600 456 M200 456 L1000 456 M200 456 L200 470 M1000 456 L1000 470" fill="none" stroke="#d9b25f" stroke-width="2"/>
  <polygon points="195,466 205,466 200,476" fill="#d9b25f"/><polygon points="595,466 605,466 600,476" fill="#d9b25f"/><polygon points="995,466 1005,466 1000,476" fill="#d9b25f"/>
  <text x="612" y="400" class="lbl">conclave start · pause · lanes</text>

  <!-- Cardinals -->
  <g>
    <rect x="40" y="480" width="320" height="200" rx="14" fill="#3a1220" stroke="#b8314a" stroke-width="2"/>
    <text x="60" y="508" class="k" style="fill:#ff8a9b">CARDINAL · query</text>
    <text x="60" y="538" class="t">claude / opus</text>
    <text x="60" y="562" class="s">your Claude login</text>
  </g>
  <g>
    <rect x="440" y="480" width="320" height="200" rx="14" fill="#3a1220" stroke="#b8314a" stroke-width="2"/>
    <text x="460" y="508" class="k" style="fill:#ff8a9b">CARDINAL · db</text>
    <text x="460" y="538" class="t">claude → Kimi API</text>
    <text x="460" y="562" class="s">Claude Code harness, another model</text>
  </g>
  <g>
    <rect x="840" y="480" width="320" height="200" rx="14" fill="#3a1220" stroke="#b8314a" stroke-width="2"/>
    <text x="860" y="508" class="k" style="fill:#ff8a9b">CARDINAL · serde</text>
    <text x="860" y="538" class="t">opencode → OpenRouter</text>
    <text x="860" y="562" class="s">a cheap model on a mechanical lane</text>
  </g>
  <g class="m">
    <text x="60" y="600" class="m">branch conclave/query</text>
    <text x="60" y="624" class="m">STATE-query.md · NOTES</text>
    <text x="60" y="648" class="m">session loop ↻</text>
    <text x="460" y="600" class="m">branch conclave/db</text>
    <text x="460" y="624" class="m">STATE-db.md · NOTES</text>
    <text x="460" y="648" class="m">session loop ↻</text>
    <text x="860" y="600" class="m">branch conclave/serde</text>
    <text x="860" y="624" class="m">STATE-serde.md · NOTES</text>
    <text x="860" y="648" class="m">session loop ↻</text>
  </g>

  <!-- Cardinals -> board -->
  <path d="M70 478 L70 434" fill="none" stroke="#8a96b8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#ag)"/>
  <text x="80" y="449" class="lblg">claims, results</text>

  <text x="600" y="716" text-anchor="middle" class="s">Every role is a few lines in conclave.toml: a runner (claude · codex · gemini · opencode · aider · custom · api)</text>
  <text x="600" y="738" text-anchor="middle" class="s">and an optional provider (any OpenAI- or Anthropic-compatible API: OpenRouter, Kimi, GLM, DeepSeek, Ollama...)</text>
</svg>
