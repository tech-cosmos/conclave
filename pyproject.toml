[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "conclave-team"
version = "0.1.0"
description = "A managed agent team: one Dean orchestrates many Cardinals on any model, Devils argue back, and you're the Pope."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Shivam Raj" }]
keywords = ["agents", "multi-agent", "claude-code", "codex", "orchestration", "llm", "research"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tech-cosmos/conclave"
Repository = "https://github.com/tech-cosmos/conclave"
Issues = "https://github.com/tech-cosmos/conclave/issues"

[project.scripts]
conclave = "conclave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["conclave"]

[tool.hatch.build.targets.sdist]
include = ["conclave", "README.md", "LICENSE"]
